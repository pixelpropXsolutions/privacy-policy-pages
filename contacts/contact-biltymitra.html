<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BiltyMitra - Support & Feedback</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --text: #111827;
            --muted: #6b7280;
            --border: #dbe2ea;
            --bg: #f4f7fb;
            --card: rgba(255, 255, 255, 0.92);
        }

        body {
            font-family: 'Inter', sans-serif;
            background:
                radial-gradient(circle at top left, #dbeafe 0%, transparent 35%),
                radial-gradient(circle at bottom right, #bfdbfe 0%, transparent 30%),
                var(--bg);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            color: var(--text);
        }

        .container {
            width: 100%;
            max-width: 620px;
            background: var(--card);
            backdrop-filter: blur(10px);
            border-radius: 28px;
            padding: 40px;
            box-shadow:
                0 10px 40px rgba(37, 99, 235, 0.08),
                0 4px 10px rgba(0, 0, 0, 0.04);
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: "";
            position: absolute;
            width: 180px;
            height: 180px;
            background: rgba(37, 99, 235, 0.08);
            border-radius: 50%;
            top: -80px;
            right: -60px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(37, 99, 235, 0.1);
            color: var(--primary);
            padding: 10px 16px;
            border-radius: 999px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .badge span {
            width: 8px;
            height: 8px;
            background: var(--primary);
            border-radius: 50%;
        }

        h1 {
            font-size: 36px;
            line-height: 1.1;
            margin-bottom: 16px;
            letter-spacing: -1px;
        }

        .description {
            color: var(--muted);
            font-size: 15px;
            line-height: 1.8;
            margin-bottom: 35px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-size: 14px;
            font-weight: 600;
            color: #1f2937;
        }

        input,
        textarea,
        select {
            width: 100%;
            border: 1.5px solid var(--border);
            background: #fff;
            border-radius: 16px;
            padding: 16px 18px;
            font-size: 15px;
            font-family: inherit;
            transition: all 0.25s ease;
            color: var(--text);
        }

        textarea {
            min-height: 140px;
            resize: vertical;
        }

        input::placeholder,
        textarea::placeholder {
            color: #9ca3af;
        }

        input:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 5px rgba(37, 99, 235, 0.12);
        }

        button {
            width: 100%;
            border: none;
            background: linear-gradient(135deg,
                    var(--primary),
                    var(--primary-dark));
            color: white;
            padding: 17px;
            border-radius: 18px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 8px;
            box-shadow: 0 12px 24px rgba(37, 99, 235, 0.22);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 30px rgba(37, 99, 235, 0.28);
        }

        .success-message {
            display: none;
            margin-top: 22px;
            padding: 16px;
            border-radius: 16px;
            background: #ecfdf5;
            border: 1px solid #a7f3d0;
            color: #065f46;
            font-size: 14px;
            font-weight: 500;
        }

        .footer {
            margin-top: 28px;
            text-align: center;
            font-size: 13px;
            color: #9ca3af;
        }

        @media (max-width: 640px) {
            .container {
                padding: 28px 22px;
                border-radius: 22px;
            }

            h1 {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="badge">
            <span></span>
            BiltyMitra Support
        </div>

        <h1>Support & Feedback</h1>

        <p class="description">
            Facing an issue or want to share feedback about BiltyMitra?
            Fill out the form below and our team will get back to you.
        </p>

        <form id="supportForm">

            <div class="form-group">
                <label for="name">Full Name</label>

                <input type="text" id="name" name="name" placeholder="Enter your full name" required />
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>

                <input type="email" id="email" name="email" placeholder="Enter your email address" required />
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>

                <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" />
            </div>

            <div class="form-group">
                <label for="type">Type</label>

                <select id="type" name="type" required>
                    <option value="">Select an option</option>
                    <option value="Issue">Issue</option>
                    <option value="Bug Report">Bug Report</option>
                    <option value="Feature Request">Feature Request</option>
                    <option value="Feedback">Feedback</option>
                </select>
            </div>

            <div class="form-group">
                <label for="message">Message</label>

                <textarea id="message" name="message" placeholder="Describe your issue or feedback..."
                    required></textarea>
            </div>

            <button type="submit" id="submitBtn">
                Submit Request
            </button>

            <div class="success-message" id="successMessage">
                Your request has been submitted successfully.
            </div>

        </form>

        <div class="footer">
            © 2026 BiltyMitra. All rights reserved.
        </div>

    </div>

    <script>
        const form = document.getElementById("supportForm");
        const successMessage = document.getElementById("successMessage");
        const submitBtn = document.getElementById("submitBtn");

        form.addEventListener("submit", async function (e) {
            e.preventDefault();

            submitBtn.innerText = "Submitting...";
            submitBtn.disabled = true;

            const formData = {
                name: document.getElementById("name").value,
                email: document.getElementById("email").value,
                phone: document.getElementById("phone").value,
                type: document.getElementById("type").value,
                message: document.getElementById("message").value
            };

            try {

                // Replace with your backend API endpoint
                const response = await fetch(
                    "https://bilty-mitra-backend.vercel.app/api/contact/support",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify(formData)
                    }
                );

                if (response.ok) {
                    form.reset();
                    successMessage.style.display = "block";
                } else {
                    alert("Failed to submit request.");
                }

            } catch (error) {
                console.error(error);
                alert("Something went wrong.");
            }

            submitBtn.innerText = "Submit Request";
            submitBtn.disabled = false;
        });
    </script>

</body>

</html>
